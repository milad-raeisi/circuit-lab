<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Circuit Lab</title>
  <defs>
    <!-- the tile: the app's violet, a little lighter at the top like a lit plastic key -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5cff"/>
      <stop offset="1" stop-color="#4330da"/>
    </linearGradient>
    <!-- breadboard holes -->
    <pattern id="holes" width="32" height="32" patternUnits="userSpaceOnUse" x="10" y="10">
      <circle cx="6" cy="6" r="3" fill="#fff"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#fde047" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.38" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.45" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#holes)" opacity="0.08"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="6"/>

  <g id="mark">
  <!-- the glow of the lit bulb -->
  <circle cx="266" cy="180" r="104" fill="url(#glow)"/>

  <!-- one loop of wire: battery on the left, the bulb closes it at the top -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M216 180H208a62 62 0 0 0-62 62V262M146 318V352a62 62 0 0 0 62 62H324a62 62 0 0 0 62-62V242a62 62 0 0 0-62-62H316" stroke-width="34"/>
    <!-- battery: long thin plate (+), short thick plate (−), with clear air between them -->
    <path d="M98 262H194" stroke-width="12"/>
    <path d="M122 318H170" stroke-width="24"/>
    <!-- the + side of the battery -->
    <path d="M88 228H110M99 217V239" stroke-width="7" stroke-opacity="0.85"/>
  </g>

  <!-- light rays -->
  <g stroke="#fde047" stroke-width="14" stroke-linecap="round">
    <path d="M266 112V84"/>
    <path d="M321 142L344 125"/>
    <path d="M211 142L188 125"/>
  </g>

  <!-- the bulb, seen from above, with its filament -->
  <circle cx="266" cy="180" r="50" fill="url(#bulb)"/>
  <path d="M244 186l7.3-10 7.3 10 7.3-10 7.3 10 7.3-10 7.3 10" fill="none" stroke="#c2620a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="250" cy="160" rx="13" ry="8" fill="#fff" opacity="0.7" transform="rotate(-30 250 160)"/>
  </g>
</svg>
